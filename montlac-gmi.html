<title>Plataforma Montlac</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Open+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<style>
/* Identidad Montlac (Manual de identidad corporativa, edición 01 · 2026)
   Azul Medianoche #3B3B5A · Cian Luz #03FFFF · Verde Impulso #54EE23 · Tinta #25253D · Niebla #F2F4F7
   El cian y el verde aparecen solo en transición: degradado 45° ascendente, en el símbolo, acentos y fondos grandes.
   Montserrat para títulos, nombre de marca y etiquetas; Open Sans para textos corridos.
   Layout: banda azul medianoche con el isologo negativo, franja de degradado, pestañas y una retícula tenue de fondo. */
:root{
  --medianoche:#3B3B5A; --cian:#03FFFF; --verde:#54EE23; --tinta:#25253D; --niebla:#F2F4F7;
  --degradado:linear-gradient(45deg,#3B3B5A 0%,#03FFFF 52%,#54EE23 100%);
  --luz:linear-gradient(90deg,#03FFFF 0%,#54EE23 100%);
  --bg:#F2F4F7; --grid:rgba(59,59,90,.045); --surface:#FFFFFF; --surface-2:#F6F7FA; --line:#DDE0E8; --line-soft:#EBEDF2;
  --ink:#25253D; --ink-2:#45455F; --muted:#6A6B82;
  --brand:#3B3B5A; --brand-ink:#FFFFFF; --brand-soft:#E7E8F0;
  --ok:#23801A; --ok-soft:#E4F7DE; --warn:#935A00; --warn-soft:#FCEFD8; --danger:#C2183F; --danger-soft:#FCE4EA;
  --info:#3B3B5A; --info-soft:#E7E8F0;
  --shadow:0 1px 2px rgba(37,37,61,.05), 0 12px 28px -20px rgba(59,59,90,.45);
  --r:10px; --r-sm:7px;
  --f-display:"Montserrat",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Open Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1C1C2E; --grid:rgba(242,244,247,.035); --surface:#25253D; --surface-2:#2D2D48; --line:#3A3A58; --line-soft:#31314D;
    --ink:#F2F4F7; --ink-2:#CDD0DC; --muted:#9C9EB5;
    --brand:#F2F4F7; --brand-ink:#25253D; --brand-soft:#33335A;
    --ok:#7BEA5B; --ok-soft:#1F3A22; --warn:#F4B860; --warn-soft:#3B2D15; --danger:#FF7D9A; --danger-soft:#3F1F2C;
    --info:#C8CAF0; --info-soft:#30304F;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 14px 30px -18px rgba(0,0,0,.9);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1C1C2E; --grid:rgba(242,244,247,.035); --surface:#25253D; --surface-2:#2D2D48; --line:#3A3A58; --line-soft:#31314D;
  --ink:#F2F4F7; --ink-2:#CDD0DC; --muted:#9C9EB5;
  --brand:#F2F4F7; --brand-ink:#25253D; --brand-soft:#33335A;
  --ok:#7BEA5B; --ok-soft:#1F3A22; --warn:#F4B860; --warn-soft:#3B2D15; --danger:#FF7D9A; --danger-soft:#3F1F2C;
  --info:#C8CAF0; --info-soft:#30304F;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 14px 30px -18px rgba(0,0,0,.9);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background-color:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55;-webkit-text-size-adjust:100%;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:36px 36px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--medianoche)}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
.mono{font-family:var(--f-mono)}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid #03C8D0;outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Banda corporativa: siempre azul medianoche con el isologo negativo */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--medianoche);color:#fff}
.topbar-in{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:16px;padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar .isologo{height:30px;width:auto;display:block}
.co{border-left:1px solid rgba(255,255,255,.2);padding-left:16px;min-width:0}
.co b{display:block;font-family:var(--f-display);font-weight:600;font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;white-space:nowrap}
.co span{display:block;font-size:11px;color:#BDBFD3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12.5px;color:#D9DBE7;min-width:0}
.who span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:22ch}
.endoso-top{display:flex;align-items:center;gap:8px;padding-left:12px;border-left:1px solid rgba(255,255,255,.2)}
.endoso-top img{height:22px;width:auto;display:block}
.grad{height:4px;background:var(--degradado)}
@media (max-width:760px){.endoso-top{display:none}}
@media (max-width:620px){.who span{display:none}.topbar .isologo{height:24px}}
@media (max-width:420px){.co{display:none}}

nav.tabs{background:var(--surface);border-bottom:1px solid var(--line)}
.tabs-in{max-width:1280px;margin:0 auto;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
.tabs-in::-webkit-scrollbar{display:none}
.tab{appearance:none;background:none;border:0;position:relative;padding:13px 12px 11px;cursor:pointer;color:var(--muted);
  font-family:var(--f-display);font-weight:600;white-space:nowrap;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink)}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--luz)}
.tab .badge{display:inline-block;min-width:18px;margin-left:6px;padding:0 5px;border-radius:99px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;line-height:18px;text-align:center;letter-spacing:0}

main{max-width:1280px;margin:0 auto;padding-block:22px 64px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Portada del panel: único lugar con fondo de gran formato (azul medianoche + diagonal de degradado) */
.hero{position:relative;overflow:hidden;border-radius:var(--r);background:var(--medianoche);color:#fff;margin-bottom:18px;
  display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;padding:26px 24px 24px}
.hero::before{content:"";position:absolute;inset:0 0 0 auto;width:42%;background:var(--degradado);clip-path:polygon(38% 0,100% 0,100% 100%,0 100%);opacity:.95}
.hero .simbolo{position:absolute;right:4%;top:50%;width:132px;transform:translateY(-50%);filter:brightness(0) invert(1);opacity:.9}
.hero > div{position:relative;z-index:1;min-width:0}
.hero .eyebrow{color:#C9CBDD}
.hero h1{font-weight:800;font-size:26px;letter-spacing:.02em;text-transform:uppercase;margin-top:6px}
.hero p{margin:6px 0 0;color:#D9DBE7;max-width:52ch}
.hero .acciones{margin-left:0;display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.hero .btn{border-color:rgba(255,255,255,.35);background:rgba(37,37,61,.55);color:#fff}
.hero .btn:hover:not(:disabled){background:rgba(37,37,61,.8)}
.hero .btn-lime{border-color:transparent;background:var(--luz);color:var(--tinta)}
@media (max-width:700px){.hero::before{width:22%;clip-path:polygon(55% 0,100% 0,100% 100%,0 100%)}.hero .simbolo{display:none}.hero h1{font-size:21px}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.card-h{padding:13px 16px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card-h h2,.card-h h3{font-size:14px;font-weight:700;letter-spacing:.01em}
.card-b{padding:16px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-display);font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);font-weight:600}
.eyebrow::before{content:"";width:18px;height:2px;border-radius:2px;background:var(--luz)}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{margin-left:auto}
.pagehead{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.pagehead h1{font-size:21px;font-weight:800;text-transform:uppercase;letter-spacing:.02em}
.pagehead p{margin:4px 0 0;color:var(--muted);font-size:13px;max-width:78ch}

label.f{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--muted);font-weight:600;min-width:0}
input[type=text],input[type=number],input[type=date],input[type=search],input[type=email],input[type=tel],select,textarea{
  width:100%;padding:8px 10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);color:var(--ink);font-size:13.5px;min-width:0;font-family:var(--f-body)}
input:focus,select:focus,textarea:focus{border-color:#03C8D0;outline:none;box-shadow:0 0 0 3px rgba(3,255,255,.18)}
textarea{resize:vertical;min-height:64px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:760px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.g2,.g3,.g4{grid-template-columns:1fr}}
.span2{grid-column:span 2}
@media (max-width:480px){.span2{grid-column:auto}}

.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:var(--r-sm);border:1px solid var(--line);
  background:var(--surface);color:var(--ink);font-family:var(--f-display);font-weight:600;font-size:12.5px;letter-spacing:.02em;cursor:pointer;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--surface-2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn-primary:hover:not(:disabled){background:var(--brand);filter:brightness(1.15)}
/* Acción destacada: luz de degradado, como en el manual */
.btn-lime{background:var(--luz);border-color:transparent;color:var(--tinta)}
.btn-lime:hover:not(:disabled){background:var(--luz);filter:brightness(1.05)}
.btn-danger{color:var(--danger)}
.btn-danger:hover:not(:disabled){background:var(--danger-soft)}
.btn-sm{padding:5px 10px;font-size:11.5px}
.btn-x{padding:4px 8px;font-size:15px;line-height:1;color:var(--muted)}

.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:600;white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)}
.p-danger{background:var(--danger-soft);color:var(--danger)} .p-info{background:var(--info-soft);color:var(--info)}
.p-mute{background:var(--surface-2);color:var(--muted)}
.tag{font-family:var(--f-mono);font-size:11.5px;padding:1px 6px;border-radius:5px;background:var(--surface-2);border:1px solid var(--line-soft);color:var(--ink-2);white-space:nowrap}
/* Color de familia de producto GMI */
.fam{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-display);font-weight:800;font-style:italic;font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2)}
.fam i{width:12px;height:12px;border-radius:3px;border:1px solid rgba(37,37,61,.15);display:inline-block}

.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-family:var(--f-display);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface-2)}
.r{text-align:right} th.r{text-align:right}
td.cat{font-family:var(--f-display);font-weight:800;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;background:var(--surface-2);color:var(--ink)}
.up{color:var(--danger)} .down{color:var(--ok)}
.items td{padding:6px 6px}
.items input,.items select{padding:6px 7px;font-size:13px}
.items input[type=number]{text-align:right}
.items input.w-qty{width:76px}.items input.w-pct{width:72px}.items input.w-prc{width:118px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kpi{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px 13px;box-shadow:var(--shadow)}
.kpi .l{font-family:var(--f-display);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--f-display);font-weight:800;font-size:21px;margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.alert{border-color:var(--danger)}
.kpi.alert .v{color:var(--danger)}

.totals{display:grid;gap:6px;font-size:13.5px;margin-left:auto;width:min(320px,100%)}
.totals div{display:flex;justify-content:space-between;gap:20px}
.totals .grand{border-top:2px solid var(--ink);margin-top:4px;padding-top:8px;font-family:var(--f-display);font-weight:800;font-size:19px}

.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:900px){.split{grid-template-columns:1fr}}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input[type=search]{max-width:280px}
.toolbar select{width:auto}
.empty{padding:36px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:13px;margin-bottom:4px;font-family:var(--f-display);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.notice{padding:11px 13px;border-radius:var(--r-sm);font-size:13px}
.n-warn{background:var(--warn-soft);color:var(--warn)} .n-danger{background:var(--danger-soft);color:var(--danger)}
.n-info{background:var(--info-soft);color:var(--info)} .n-ok{background:var(--ok-soft);color:var(--ok)}
.hint{font-size:12px;color:var(--muted)}
.contact{display:grid;gap:2px;font-size:12.5px;color:var(--ink-2)}
.contact b{color:var(--ink);font-size:13.5px}
.aging{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--line-soft)}
.aging i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:90;background:var(--tinta);color:#F2F4F7;padding:10px 18px;border-radius:99px;font-size:13px;font-weight:600;box-shadow:var(--shadow);max-width:90vw;border:1px solid rgba(3,255,255,.35)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-radius:var(--r-sm);background:var(--danger-soft);color:var(--danger);font-size:13px}
.loading{padding:80px 20px;text-align:center;color:var(--muted)}
details.hist summary{cursor:pointer;color:var(--muted);font-size:12px}
details.sub{border:1px solid var(--line-soft);border-radius:var(--r-sm);padding:10px 12px;background:var(--surface-2)}
details.sub summary{cursor:pointer;display:flex;gap:10px;flex-wrap:wrap;align-items:baseline}
details.sub summary b{font-family:var(--f-display);font-size:12.5px}
details.sub .items input{background:var(--surface)}
/* Pad de firma: siempre sobre blanco, en ambos temas, como el papel de la remisión */
.firmabox{position:relative;border:1.5px dashed var(--line);border-radius:var(--r-sm);background:#FFFFFF;height:180px;overflow:hidden;max-width:620px}
.firmabox canvas{width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.firmahint{position:absolute;left:14px;bottom:10px;font-size:12px;color:#9A9AB4;pointer-events:none}
/* Sello de endoso: GMI, una marca de Montlac */
.endoso{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.endoso .gmi{height:30px;width:auto;background:#fff;border-radius:6px;padding:4px 6px}
.endoso .sello{display:flex;flex-direction:column;gap:2px;border-left:1px solid var(--line);padding-left:14px}
.endoso .sello small{font-family:var(--f-display);font-weight:600;font-size:8.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
.endoso .sello img{height:16px;width:auto}
.famgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.famcard{border-radius:var(--r-sm);padding:12px 12px 10px;color:#25253D;min-height:86px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid rgba(37,37,61,.08)}
.famcard b{font-family:var(--f-display);font-weight:800;font-style:italic;font-size:15px;line-height:1.05;text-transform:uppercase}
.famcard b span{display:block;font-weight:600;font-size:11px;letter-spacing:.06em}
.famcard small{font-size:11px;opacity:.85}
</style>

/* --------------------------------------------------------------- utilidades */
const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const n0 = v => Number(v) || 0;
const fmt$ = v => "$ " + new Intl.NumberFormat("es-CO",{maximumFractionDigits:0}).format(Math.round(n0(v)));
const fmtN = (v,d=0) => new Intl.NumberFormat("es-CO",{minimumFractionDigits:d,maximumFractionDigits:d}).format(n0(v));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hoy = () => { const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const fecha = iso => { if(!iso) return "—"; const p=String(iso).slice(0,10).split("-"); return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:iso; };
const dias = (a,b) => { const x=new Date(String(a).slice(0,10)+"T00:00:00"), y=new Date(String(b).slice(0,10)+"T00:00:00"); return isNaN(x)||isNaN(y)?0:Math.round((y-x)/864e5); };
const sumarDias = (iso,n) => { const d=new Date(String(iso).slice(0,10)+"T00:00:00"); d.setDate(d.getDate()+n0(n)); return d.toISOString().slice(0,10); };
const norm = s => String(s ?? "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const uid = p => p + "-" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const clone = o => JSON.parse(JSON.stringify(o));
function toast(m){ $(".toast")?.remove(); const t=document.createElement("div"); t.className="toast"; t.setAttribute("role","status"); t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),3200); }
function errMsg(e){
  if(e?.code==="invalid_argument") return "No tienes permiso para guardar cambios en este enlace.";
  if(e?.code==="quota_exceeded") return "La base de datos está llena. Elimina documentos antiguos.";
  return "No se pudo guardar. Revisa la conexión e inténtalo de nuevo.";
}

/* --------------------------------------------------------------- arranque */
async function boot(){
  try{ S.db = await window.claude?.use?.("db") ?? null; }catch(_){ S.db=null; }
  try{ S.user = await window.claude?.use?.("user") ?? null; }catch(_){ S.user=null; }
  window.claude?.use?.("assets")?.then(a => { S.assets=a||null; pintar(); }).catch(()=>{});
  window.claude?.use?.("sample")?.then(a => { S.sample=a||null; pintar(); }).catch(()=>{});
  window.claude?.use?.("mcp")?.then(a => { S.mcp=a||null; pintar(); }).catch(()=>{});
  if(S.user){
    try{ S.meId = await S.user.id(); const me = await S.user.me(); S.meName = me?.name || ""; }catch(_){}
  }
  if(!S.db){ pintar(); return; }
  const on = (ref, key, map) => ref.onSnapshot(snap => { map(snap); S.ready[key]=true; pintar(); },
    e => { console.warn("db", key, e?.code); S.ready[key]=true; if(e?.code==="revoked"){ S.db=null; } pintar(); });
  on(S.db.doc("config/general"), "config", s => { S.config = {...DEF_CONFIG, ...(s.data()||{})}; });
  for(const c of ["productos","clientes","transportadores","cotizaciones","ventas","remisiones","ordenes","estudios"]){
    on(S.db.collection(c), c, s => { S[c] = s.docs.map(d => ({...d.data(), id:d.id})); });
  }
  setTimeout(()=>{ ["config","productos"].forEach(k=>S.ready[k]=true); pintar(); }, 8000);
}

async function guardar(col, id, data){
  if(!S.db) throw {code:"unavailable"};
  await S.db.collection(col).doc(id).set(data);
}
async function borrar(col, id){ await S.db.collection(col).doc(id).delete(); }

/* --------------------------------------------------------------- modelo */
function productosOrdenados(){
  return [...S.productos].sort((a,b) => n0(a.orden)-n0(b.orden) || String(a.categoria).localeCompare(b.categoria));
}
function categorias(){ return [...new Set(productosOrdenados().map(p=>p.categoria))]; }
function margen(p){ return n0(p.precio) ? (1 - n0(p.costo)/n0(p.precio))*100 : 0; }
function prodNombre(p){ return `${p.categoria} · ${p.presentacion}`; }

function siguienteNumero(tipo){
  const t = TIPOS[tipo];
  const max = S[t.col].reduce((m,d) => { const k = parseInt(String(d.numero||"").replace(/\D/g,""),10); return isNaN(k)?m:Math.max(m,k); }, 0);
  return `${t.pref}-${String(max+1).padStart(4,"0")}`;
}
function snapCliente(c){
  return c ? { clienteId:c.id, cliente:{ nombre:c.nombre||"", nit:c.nit||"", contacto:c.contacto||"", cargo:c.cargo||"",
    telefono:c.telefono||"", email:c.email||"", direccion:c.direccion||"", ciudad:c.ciudad||"" } }
           : { clienteId:"", cliente:{ nombre:"", nit:"", contacto:"", cargo:"", telefono:"", email:"", direccion:"", ciudad:"" } };
}
function snapTransp(t){
  return t ? { transportadorId:t.id, transporte:{ empresa:t.empresa||"", nit:t.nit||"", conductor:t.conductor||"",
    cedula:t.cedula||"", telefono:t.telefono||"", placa:t.placa||"", vehiculo:t.vehiculo||"" } }
           : { transportadorId:"", transporte:{ empresa:"", nit:"", conductor:"", cedula:"", telefono:"", placa:"", vehiculo:"" } };
}
function nuevoDoc(tipo){
  const base = { numero:siguienteNumero(tipo), fecha:hoy(), items:[], observaciones:"", estado:TIPOS[tipo].estados[0],
                 autorId:S.meId||"", creado:new Date().toISOString(), _nuevo:true };
  if(tipo==="cot") return { ...base, ...snapCliente(null), validez:n0(S.config.validezDias)||15, ...snapTransp(null) };
  if(tipo==="ven") return { ...base, ...snapCliente(null), formaPago:"Crédito", plazo:30, vence:sumarDias(hoy(),30),
                            ordenCliente:"", factura:"", cotizacionId:"", abonos:[] };
  if(tipo==="rem") return { ...base, ...snapCliente(null), ...snapTransp(null), ventaId:"", direccionEntrega:"",
                            guia:"", flete:0, fechaEntrega:"", recibidoPor:"", recibidoCc:"" };
  if(tipo==="oc")  return { ...base, proveedor:{ nombre:S.config.proveedorNombre||"GMI", nit:S.config.proveedorNit||"",
                            contacto:S.config.proveedorContacto||"", telefono:S.config.proveedorTelefono||"", email:S.config.proveedorEmail||"" },
                            entrega:sumarDias(hoy(),8), lugarEntrega:S.config.direccion||"", ...snapTransp(null), condiciones:"Crédito 30 días" };
}
function itemDesde(p, tipo, clienteId){
  return { productoId:p.id, descripcion:p.categoria, presentacion:p.presentacion, rendimiento:p.rendimiento??"",
           cantidad:1, precio: tipo==="oc" ? n0(p.costo) : precioCliente(p, clienteId), desc:0 };
}
function totales(d){
  const ivaPct = n0(d.ivaPct ?? S.config.iva ?? 19);
  let bruto=0, desc=0;
  (d.items||[]).forEach(it => { const b=n0(it.cantidad)*n0(it.precio); bruto+=b; desc+=b*n0(it.desc)/100; });
  const base=bruto-desc, iva=base*ivaPct/100;
  return { bruto, desc, base, ivaPct, iva, total:base+iva };
}
function pagado(v){ return (v.abonos||[]).reduce((s,a)=>s+n0(a.valor),0); }
function saldo(v){
  if(v.estado==="Anulada") return 0;
  if(v.formaPago==="Contado") return 0;
  return Math.max(0, totales(v).total - pagado(v));
}
function estadoPago(v){
  if(v.estado==="Anulada") return ["Anulada","p-mute"];
  const s=saldo(v);
  if(s<=0.5) return ["Pagada","p-ok"];
  const d=dias(v.vence||v.fecha, hoy());
  if(d>0) return [`Vencida ${d} d`, d>30?"p-danger":"p-warn"];
  return [pagado(v)>0?"Abonada":"Por cobrar","p-info"];
}
function pillEstado(tipo, e){
  const m = { Borrador:"p-mute", Enviada:"p-info", Aprobada:"p-ok", Perdida:"p-danger",
              Activa:"p-ok", Anulada:"p-mute", Pendiente:"p-warn", "En ruta":"p-info", Entregada:"p-ok",
              Emitida:"p-info", Confirmada:"p-warn", Recibida:"p-ok" };
  return `<span class="pill ${m[e]||"p-mute"}"><i></i>${esc(e)}</span>`;
}
function remisionesDeVenta(v){ return S.remisiones.filter(r => r.ventaId===v.id && r.estado!=="Anulada"); }

  if(dec.estado!=="Aprobado") return `<div class="notice n-warn">Este cliente no tiene crédito aprobado (${esc(dec.estado||"sin estudio")}). El crédito es opcional: puedes venderle de contado o
    <button class="btn btn-sm" data-go-cred="${esc(d.clienteId)}">abrir su estudio de crédito</button>.</div>`;
  const disp=n0(dec.cupo)-otros;
  if(tot>disp) return `<div class="notice n-danger">La venta (${fmt$(tot)}) supera el cupo disponible: aprobado ${fmt$(dec.cupo)}, utilizado ${fmt$(otros)}, disponible ${fmt$(Math.max(0,disp))}.</div>`;
  if(n0(d.plazo)>n0(dec.plazo)) return `<div class="notice n-warn">El plazo de la venta (${d.plazo} días) es mayor al aprobado para el cliente (${dec.plazo} días).</div>`;
  return `<div class="notice n-ok">Crédito aprobado: cupo ${fmt$(dec.cupo)} a ${dec.plazo} días. Disponible después de esta venta: ${fmt$(disp-tot)}.</div>`;
}
function carteraMini(clienteId){

async function guardarEditor(silencioso){
  const d=S.edit, tipo=S.editTipo, t=TIPOS[tipo];
  if(tipo!=="oc" && !String(d.cliente?.nombre||"").trim()){ toast("Escribe o selecciona el cliente."); throw new Error("sin cliente"); }
  if(!d.items.length){ toast("Agrega al menos un producto."); throw new Error("sin items"); }
  if(d._nuevo){
    d.numero = siguienteNumero(tipo);
    if(S[t.col].some(x=>x.id===d.numero)) d.numero = siguienteNumero(tipo);
    d.id = d.numero;
  }
  d.ivaPct = n0(S.config.iva ?? 19);
  if(tipo==="ven" && d.formaPago==="Crédito"){ d.plazo=clampPlazo(d.plazo); if(dias(d.fecha,d.vence)>PLAZO_MAX) d.vence=sumarDias(d.fecha,PLAZO_MAX); }
  try{
    await guardar(t.col, d.id, limpiar(d));
    delete d._nuevo;
    if(!silencioso){ toast(`${t.titulo} ${d.numero} guardada.`); pintar(); }
  }catch(e){ toast(errMsg(e)); throw e; }
}

function conHistorial(p, nuevoPrecio, nuevoCosto, nota){
  const o = {...p}; delete o.id;
  if(Math.round(n0(nuevoPrecio))!==Math.round(n0(p.precio)) || Math.round(n0(nuevoCosto))!==Math.round(n0(p.costo))){
    if(Math.round(n0(nuevoPrecio))!==Math.round(n0(p.precio))) o.precioAnterior = n0(p.precio);
    o.costoAnterior = n0(p.costo);
    o.historial = [...(p.historial||[]), { fecha:hoy(), precio:n0(p.precio), costo:n0(p.costo), nota:nota||"Precio reemplazado" }].slice(-30);
    o.precio = Math.round(n0(nuevoPrecio)); o.costo = Math.round(n0(nuevoCosto)); o.actualizado = new Date().toISOString();
  }
  return o;
}

function cablearEntidad(key){

  if(!S.ent || S.ent.tipo!==key) return;

    try{ await guardar(E.col, id, o); S.ent=null; toast(`${E.titulo} guardado.`); pintar(); }catch(e){ toast(errMsg(e)); }
  };
  const b=$("#e-borrar"); if(b) b.onclick = () => { S.confirmar="ent"; pintar(); };
  const si=$("#e-si"); if(si) si.onclick = async () => { try{ await borrar(E.col, S.ent.data.id); S.ent=null; S.confirmar=null; toast("Registro eliminado."); pintar(); }catch(e){ toast(errMsg(e)); } };
  const no=$("#e-no"); if(no) no.onclick = () => { S.confirmar=null; pintar(); };
  $$("[data-go-cred]").forEach(b => b.onclick = () => { S.ent=null; abrirEstudio(b.dataset.goCred); });
  cablearPreciosCliente(); cablearDocsCliente();
}

const C_NAVY=[59,59,90], C_LIME=[84,238,35], C_CIAN=[3,255,255], C_INK=[37,37,61], C_MUTE=[106,107,130], C_SOFT=[242,244,247];

let PDF_FUENTES = true;
function pdfBase(titulo, numero, fechaDoc){

const FT = f => PDF_FUENTES ? f : "helvetica";
/* Degradado Montlac: azul medianoche 0 % → cian luz 52 % → verde impulso 100 % */
function grad(d,x,y,w,h){ const n=48; for(let i=0;i<n;i++){ const t=i/(n-1); const [a,b,u] = t<0.52 ? [C_NAVY,C_CIAN,t/0.52] : [C_CIAN,C_LIME,(t-0.52)/0.48];
  d.setFillColor(...a.map((v,k)=>Math.round(v+(b[k]-v)*u))); d.rect(x+w*i/n,y,w/n+0.6,h,"F"); } }
function pdfPie(d){
  const W=d.internal.pageSize.getWidth(), H=d.internal.pageSize.getHeight(), np=d.getNumberOfPages(), c=S.config;
  for(let i=1;i<=np;i++){ d.setPage(i);
    grad(d,0,H-8,W,8);
    d.setDrawColor(221,224,232); d.setLineWidth(0.5); d.line(40,H-50,W-40,H-50);
    d.setFont(FT("OpenSans"),"normal"); d.setFontSize(8); d.setTextColor(...C_MUTE);
    d.text([c.email,"www.montlac.com",c.telefono].filter(Boolean).join("   ·   "), 40, H-34);
    d.text(`Página ${i} de ${np}`, W/2, H-22, {align:"center"});
    try{ d.addImage(GMI_WHITE_JPG,"JPEG",W-40-20*GMI_WHITE_R,H-44,20*GMI_WHITE_R,20); }catch(_){}
    d.setFont(FT("Montserrat"),"normal"); d.setFontSize(5.5); d.setCharSpace(1.2); d.text("UNA MARCA DE MONTLAC", W-40, H-18, {align:"right"}); d.setCharSpace(0);
  }
}
function bloquePDF(d, x, y, w, titulo, lineas){
  d.setFillColor(...C_SOFT); d.roundedRect(x,y,w,16+lineas.length*12+6,5,5,"F");
  d.setFont(FT("Montserrat"),"normal"); d.setFontSize(7); d.setCharSpace(1.2); d.setTextColor(...C_NAVY); d.text(titulo.toUpperCase(), x+10, y+13); d.setCharSpace(0);
  d.setFont(FT("OpenSans"),"normal"); d.setFontSize(9); d.setTextColor(...C_INK);
  lineas.forEach((l,i)=>{ const [k,v]=l; d.setTextColor(...C_MUTE); d.text(k, x+10, y+28+i*12); d.setTextColor(...C_INK);
    d.text(d.splitTextToSize(String(v||"—"), w-82)[0], x+72, y+28+i*12); });
  return y+16+lineas.length*12+6;
}

    : bloquePDF(d,40,y,half,"Cliente",[["Razón social",c.nombre],["NIT/CC",c.nit],["Contacto",[c.contacto,c.cargo].filter(Boolean).join(" · ")],["Teléfono",c.telefono],["Correo",c.email],["Dirección",[c.direccion,c.ciudad].filter(Boolean).join(", ")]]);

  if(tipo==="rem"){ const v=S.ventas.find(x=>x.id===doc.ventaId); datos=[["Venta",v?.numero],["Entregar en",doc.direccionEntrega||[c.direccion,c.ciudad].filter(Boolean).join(", ")],["Estado",doc.estado],["Guía",doc.guia]]; }
  if(tipo==="oc")  datos=[["Entrega",fecha(doc.entrega)],["Lugar",doc.lugarEntrega],["Condiciones",doc.condiciones],["Estado",doc.estado]];
  const der = bloquePDF(d,40+half+12,y,half,"Datos del documento",datos);
  y=Math.max(izq,der)+10;
  if(tipo==="rem" || ((tipo==="oc"||tipo==="cot") && (tr.empresa||tr.conductor))){
    y = bloquePDF(d,40,y,W-80,"Transportador",[["Empresa",[tr.empresa,tr.nit?"NIT "+tr.nit:""].filter(Boolean).join(" · ")],["Conductor",[tr.conductor,tr.cedula?"CC "+tr.cedula:"",tr.telefono].filter(Boolean).join(" · ")],["Vehículo",[tr.placa?"Placa "+tr.placa:"",tr.vehiculo].filter(Boolean).join(" · ")]])+10;

    if(rec){ y+=14; d.setFontSize(8.2); d.setTextColor(...C_INK);
      const ls=d.splitTextToSize(`Firma electrónica registrada el ${fechaHora(rec.fechaHora)}${rec.observaciones?" · Observaciones: "+rec.observaciones:""} · Código de verificación: ${String(rec.hash||"").slice(0,16).toUpperCase()} (SHA-256 completo: ${rec.hash}).`, W-80);
      nuevaSi(ls.length*10+4); d.text(ls,40,y); y+=ls.length*10; }

/* =====================================================================
   CRÉDITO · estudio de clientes (opcional)
   Documentos (RUT, Cámara de Comercio, estados financieros) en `assets`,
   estudio por cliente en `estudios/{clienteId}`.
   Plazo de financiación nunca mayor a 45 días.
   ===================================================================== */
const PLAZO_MAX = 45;
/* Familias de producto GMI (manual, sección 15): un color propio por producto */
const FAMILIAS = [
  { id:"ocean",  nombre:"OCEAN",  sub:"SEAL",    desc:"Sellador impermeabilizante",                 c1:"#54EE23", c2:"#3DB618" },
  { id:"latex",  nombre:"LATEX",  sub:"BONDING", desc:"Refuerzo en aplicaciones de albañilería",    c1:"#FF005A", c2:"#C70047", tx:"#FFFFFF" },
  { id:"mortar", nombre:"MORTAR", sub:"MASONRY", desc:"Impermeabilización basada en nanotecnología", c1:"#FEC170", c2:"#FA4A4F" },
  { id:"roket",  nombre:"ROKET",  sub:"ELASTIK", desc:"Sellador elastomérico",                      c1:"#D7FF01", c2:"#9ACC00" },

const FAM_DEF = { "GMLATEX":"latex", "GMMORTAR":"mortar", "ESTUCO INTERIOR":"stucco", "ESTUCO EXTERIOR":"stucco" };
function familiaDe(cat){ const m=S.config.familias||{}; const id = (cat in m) ? m[cat] : FAM_DEF[cat]; return FAMILIAS.find(f=>f.id===id) || null; }
function famChip(cat){ const f=familiaDe(cat); return f ? `<span class="fam"><i style="background:linear-gradient(135deg,${f.c1},${f.c2})"></i>${f.nombre} ${f.sub}</span>` : ""; }
const TIPOS_DOC = ["RUT","Cámara de Comercio","Estados financieros año actual","Estados financieros año anterior","Otro"];
const ESTADOS_CRED = ["Sin estudio","En estudio","Aprobado","Rechazado","Solo contado"];
const CAMPOS_EEFF = [
  ["activoCorriente","Activo corriente"],["inventarios","Inventarios"],["activoTotal","Activo total"],
  ["pasivoCorriente","Pasivo corriente"],["pasivoTotal","Pasivo total"],["patrimonio","Patrimonio"],
  ["ingresos","Ingresos operacionales"],["utilidadNeta","Utilidad neta"],
];
const CAMPOS_RUT = [["nit","NIT"],["razonSocial","Razón social"],["ciiu","Actividad CIIU"],["responsabilidades","Responsabilidades tributarias"],["direccion","Dirección"],["ciudad","Ciudad"],["fechaDocumento","Fecha del RUT","date"]];
const CAMPOS_CAM = [["tipoSociedad","Tipo de sociedad"],["representanteLegal","Representante legal"],["fechaMatricula","Fecha de matrícula","date"],["fechaRenovacion","Última renovación","date"],["estadoMatricula","Estado de la matrícula"],["fechaExpedicion","Fecha de expedición del certificado","date"]];

const clampPlazo = v => Math.max(0, Math.min(PLAZO_MAX, Math.round(n0(v))));
function estudioDe(clienteId){
  return S.estudios.find(e=>e.id===clienteId) || null;
}
function estudioVacio(c){
  return { clienteId:c.id, docs:[], rut:{ nit:c.nit||"", razonSocial:c.nombre||"", ciudad:c.ciudad||"", direccion:c.direccion||"" }, camara:{},
           eeff:{ act:{ anio:new Date().getFullYear()-1 }, ant:{ anio:new Date().getFullYear()-2 } },
           decision:{ estado:"Sin estudio", cupo:0, plazo:0, comentario:"" }, ia:null, _nuevo:true };
}
function credCfg(){
  const c=S.config;
  return { pctPat:n0(c.credPctPatrimonio ?? 10), pctCT:n0(c.credPctCapitalTrabajo ?? 20), pctIng:n0(c.credPctIngresosMes ?? 30),
           tope:n0(c.credCupoTope ?? 0), vigCam:n0(c.credVigenciaCamara ?? 30) };
}
function moraInterna(clienteId){
  const vs=S.ventas.filter(v=>v.clienteId===clienteId && v.estado!=="Anulada");
  let mora=0, saldoT=0; vs.forEach(v=>{ const s=saldo(v); saldoT+=s; if(s>0) mora=Math.max(mora,dias(v.vence||v.fecha,hoy())); });
  return { mora, saldo:saldoT, ventas:vs.length };
}

/** Indicadores, puntaje y cupo sugerido. Todo se recalcula en la página. */
function analizar(est, clienteId){
  const a=est.eeff?.act||{}, b=est.eeff?.ant||{}, cfg=credCfg();
  const has = o => CAMPOS_EEFF.some(([k])=>n0(o[k])!==0);
  const div = (x,y) => n0(y) ? n0(x)/n0(y) : null;
  const r = {
    liquidez: div(a.activoCorriente,a.pasivoCorriente),
    acida: div(n0(a.activoCorriente)-n0(a.inventarios),a.pasivoCorriente),
    endeud: div(a.pasivoTotal,a.activoTotal),
    capTrabajo: has(a) ? n0(a.activoCorriente)-n0(a.pasivoCorriente) : null,
    margen: div(a.utilidadNeta,a.ingresos),
    roe: div(a.utilidadNeta,a.patrimonio),
    crec: (n0(a.ingresos)&&n0(b.ingresos)) ? n0(a.ingresos)/n0(b.ingresos)-1 : null,
    antig: est.camara?.fechaMatricula ? dias(est.camara.fechaMatricula,hoy())/365.25 : null,
  };
  const tramo = (v, reglas, dflt=0) => { if(v==null) return null; for(const [cond,pts] of reglas) if(cond(v)) return pts; return dflt; };
  const tiposDoc = new Set((est.docs||[]).map(d=>d.tipo));
  const docsOk = ["RUT","Cámara de Comercio","Estados financieros año actual"].filter(t=>tiposDoc.has(t)).length;
  const items = [
    ["Liquidez (razón corriente)", r.liquidez==null?"—":fmtN(r.liquidez,2)+" veces", 20, tramo(r.liquidez,[[v=>v>=1.5,20],[v=>v>=1.2,14],[v=>v>=1,8]]), "≥ 1,5 ideal"],
    ["Prueba ácida", r.acida==null?"—":fmtN(r.acida,2)+" veces", 10, tramo(r.acida,[[v=>v>=1,10],[v=>v>=0.7,6],[v=>v>=0.5,3]]), "≥ 1,0 ideal"],
    ["Endeudamiento", r.endeud==null?"—":fmtN(r.endeud*100,1)+"%", 20, tramo(r.endeud,[[v=>v<=0.5,20],[v=>v<=0.65,13],[v=>v<=0.8,6]]), "≤ 50% ideal"],
    ["Margen neto", r.margen==null?"—":fmtN(r.margen*100,1)+"%", 15, tramo(r.margen,[[v=>v>=0.08,15],[v=>v>=0.04,11],[v=>v>=0.01,7],[v=>v>0,4]]), "≥ 8% ideal"],
    ["Rentabilidad del patrimonio", r.roe==null?"—":fmtN(r.roe*100,1)+"%", 10, tramo(r.roe,[[v=>v>=0.12,10],[v=>v>=0.05,7],[v=>v>0,4]]), "≥ 12% ideal"],
    ["Crecimiento en ventas", r.crec==null?"—":(r.crec>0?"+":"")+fmtN(r.crec*100,1)+"%", 10, tramo(r.crec,[[v=>v>=0.05,10],[v=>v>=0,7],[v=>v>=-0.1,3]]), "requiere 2 años"],
    ["Antigüedad de la empresa", r.antig==null?"—":fmtN(r.antig,1)+" años", 10, tramo(r.antig,[[v=>v>=5,10],[v=>v>=3,7],[v=>v>=1,4]],1), "según Cámara de Comercio"],
    ["Documentos completos", `${docsOk} de 3`, 5, Math.round(docsOk/3*5), "RUT, Cámara, estados financieros"],
  ];
  let score = items.reduce((s,i)=>s+(i[3]||0),0);
  const m = moraInterna(clienteId);
  let ajuste = 0; if(m.mora>60) ajuste=-20; else if(m.mora>30) ajuste=-10; else if(m.mora>0) ajuste=-4;
  score = Math.max(0, Math.min(100, score+ajuste));

  const alertas=[];
  const cam=est.camara||{};
  if(!tiposDoc.has("RUT")) alertas.push(["warn","Falta adjuntar el RUT."]);
  if(!tiposDoc.has("Cámara de Comercio")) alertas.push(["warn","Falta adjuntar el certificado de Cámara de Comercio."]);
  else if(cam.fechaExpedicion && dias(cam.fechaExpedicion,hoy())>cfg.vigCam) alertas.push(["warn",`El certificado de Cámara tiene ${dias(cam.fechaExpedicion,hoy())} días; se pide de máximo ${cfg.vigCam}.`]);
  if(cam.fechaRenovacion){ const y=new Date().getFullYear(), ry=Number(String(cam.fechaRenovacion).slice(0,4)); const lim=`${y}-03-31`;
    if(ry<y && hoy()>lim) alertas.push(["danger",`La matrícula mercantil no aparece renovada en ${y} (última: ${fecha(cam.fechaRenovacion)}).`]); }
  if(cam.estadoMatricula && !/activ/i.test(cam.estadoMatricula)) alertas.push(["danger",`Estado de la matrícula: ${cam.estadoMatricula}.`]);
  if(!has(a)) alertas.push(["warn","No hay estados financieros digitados: no se puede calcular un cupo."]);
  if(has(a) && n0(a.patrimonio)<=0) alertas.push(["danger","Patrimonio negativo o en cero."]);
  if(has(a) && Math.abs(n0(a.activoTotal)-n0(a.pasivoTotal)-n0(a.patrimonio)) > Math.max(1000, n0(a.activoTotal)*0.01))
    alertas.push(["warn","Activo total ≠ pasivo total + patrimonio. Revisa las cifras digitadas."]);
  if(n0(a.utilidadNeta)<0) alertas.push(["warn","La empresa reporta pérdida en el último año."]);
  if(m.mora>0) alertas.push([m.mora>30?"danger":"warn",`Mora interna actual de ${m.mora} días con saldo de ${fmt$(m.saldo)}.`]);
  if(est.rut?.nit && S.clientes.find(c=>c.id===clienteId)?.nit && norm(est.rut.nit).replace(/\D/g,"").slice(0,9)!==norm(S.clientes.find(c=>c.id===clienteId).nit).replace(/\D/g,"").slice(0,9))
    alertas.push(["warn","El NIT del RUT no coincide con el NIT registrado del cliente."]);

  let cat = score>=75?"A":score>=60?"B":score>=45?"C":"D";
  if(!has(a) || n0(a.patrimonio)<=0 || (cam.estadoMatricula && !/activ/i.test(cam.estadoMatricula))) cat="D";
  const plazo = { A:45, B:30, C:15, D:0 }[cat];
  const factor = { A:1, B:0.7, C:0.4, D:0 }[cat];
  const topes = [];
  if(n0(a.patrimonio)>0) topes.push([`${cfg.pctPat}% del patrimonio`, n0(a.patrimonio)*cfg.pctPat/100]);
  if(r.capTrabajo>0) topes.push([`${cfg.pctCT}% del capital de trabajo`, r.capTrabajo*cfg.pctCT/100]);
  if(n0(a.ingresos)>0) topes.push([`${cfg.pctIng}% de las ventas de un mes`, n0(a.ingresos)/12*cfg.pctIng/100]);
  const base = topes.length ? Math.min(...topes.map(t=>t[1])) : 0;
  let cupo = Math.floor(base*factor/100000)*100000;
  if(cfg.tope>0) cupo=Math.min(cupo,cfg.tope);
  return { r, items, score, ajuste, mora:m, cat, plazo, factor, topes, base, cupo, alertas, completo:has(a) };
}
function pillCred(estado){
  const m={ "Aprobado":"p-ok","Rechazado":"p-danger","En estudio":"p-warn","Solo contado":"p-info","Sin estudio":"p-mute" };
  return `<span class="pill ${m[estado]||"p-mute"}"><i></i>${esc(estado||"Sin estudio")}</span>`;
}
const CAT_TXT = { A:"Riesgo bajo", B:"Riesgo moderado", C:"Riesgo alto", D:"No financiable" };
const CAT_CLS = { A:"p-ok", B:"p-info", C:"p-warn", D:"p-danger" };

function abrirEstudio(clienteId){
  const c=S.clientes.find(x=>x.id===clienteId); if(!c) return;
  const e=estudioDe(clienteId);
  S.cred = e ? { ...estudioVacio(c), ...clone(e), _nuevo:false } : estudioVacio(c);
  ["rut","camara","decision"].forEach(k=>S.cred[k]=S.cred[k]||{});
  S.cred.eeff = S.cred.eeff||{}; S.cred.eeff.act=S.cred.eeff.act||{}; S.cred.eeff.ant=S.cred.eeff.ant||{}; S.cred.docs=S.cred.docs||[];
  S.tab="credito"; S.iaMsg=null; S.confirmar=null; pintar(); window.scrollTo(0,0);
}
function estudioParaGuardar(est){
  const o=clone(est); delete o._nuevo; delete o.id;
  o.decision.plazo = o.decision.estado==="Aprobado" ? clampPlazo(o.decision.plazo) : 0;
  if(o.decision.estado!=="Aprobado") o.decision.cupo = 0;
  const an=analizar(est,est.clienteId); o.resultado={ score:an.score, cat:an.cat, cupoSugerido:an.cupo, plazoSugerido:an.plazo, completo:an.completo };
  o.actualizado=new Date().toISOString(); o.autorId=S.meId||o.autorId||"";
  return o;
}
async function guardarEstudio(silencioso){
  const est=S.cred, prev=estudioDe(est.clienteId);
  if(est.decision.estado==="Aprobado" && !n0(est.decision.cupo)){ toast("Escribe el cupo aprobado o usa el sugerido."); return false; }
  const cambioDecision = !prev || ["estado","cupo","plazo"].some(k=>String(prev.decision?.[k]??"")!==String(est.decision[k]??""));
  if(cambioDecision){ est.decision.fecha=hoy(); est.decision.historial=[...(prev?.decision?.historial||[]), ...(prev?.decision?.estado?[{ fecha:prev.decision.fecha||"", estado:prev.decision.estado, cupo:prev.decision.cupo, plazo:prev.decision.plazo }]:[])].slice(-20); }
  try{
    await guardar("estudios", est.clienteId, estudioParaGuardar(est));
    const c=S.clientes.find(x=>x.id===est.clienteId);
    if(c && cambioDecision){ const aprob=est.decision.estado==="Aprobado"; const o={...c}; delete o.id;
      Object.assign(o,{ cupo:aprob?n0(est.decision.cupo):0, plazo:aprob?clampPlazo(est.decision.plazo):0, credito:est.decision.estado });
      await guardar("clientes", c.id, o); }
    est._nuevo=false; if(!silencioso){ toast("Estudio guardado."); pintar(); } return true;
  }catch(e){ toast(errMsg(e)); return false; }
}
async function subirDoc(){

  if(f.size>20*1024*1024){ toast("El archivo supera 20 MB."); return; }

  if(!["application/pdf","image/jpeg","image/png"].includes(type)){ toast("Adjunta un PDF, JPG o PNG."); return; }

async function quitarDoc(i){
  const d=S.cred.docs[i]; if(!d) return;
  try{ await S.assets.delete(d.id); }catch(e){ if(e?.code!=="not_found") console.warn("assets.delete", e?.code); }

/* --------------------------------------------------------------- Claude */
async function textoYImagenesDe(doc, maxImgs){
  const res = await fetch("/_blob/"+doc.id); if(!res.ok) throw new Error("fetch "+res.status);
  const buf = await res.arrayBuffer(); const imgs=[]; let texto="";
  if(doc.mime==="application/pdf" && window.pdfjsLib){
    const pdf = await pdfjsLib.getDocument({ data:new Uint8Array(buf), isEvalSupported:false }).promise;
    const n = Math.min(pdf.numPages, 8);
    for(let p=1;p<=n;p++){ const pg=await pdf.getPage(p); const tc=await pg.getTextContent(); texto += `\n[página ${p}]\n` + tc.items.map(i=>i.str).join(" "); }
    if(texto.replace(/\[página \d+\]|\s/g,"").length < 150 && maxImgs>0){   // PDF escaneado: se envían las páginas como imagen
      for(let p=1;p<=Math.min(pdf.numPages,maxImgs);p++){
        const pg=await pdf.getPage(p), vp=pg.getViewport({ scale:1.6 }), cv=document.createElement("canvas");
        cv.width=vp.width; cv.height=vp.height; await pg.render({ canvasContext:cv.getContext("2d"), viewport:vp }).promise;
        imgs.push(await new Promise(r=>cv.toBlob(r,"image/jpeg",0.85)));
      }
    }
  } else if(doc.mime.startsWith("image/") && maxImgs>0){
    imgs.push(new Blob([buf], { type:doc.mime }));
  }
  return { texto:texto.slice(0,14000), imgs };
}
async function leerConClaude(){
  const est=S.cred; S.iaBusy="leer"; S.iaMsg=["n-info","Leyendo los documentos adjuntos…"]; pintar();
  try{
    const lim = await S.sample.limits().catch(()=>null);
    let cupoImg = lim?.images ? lim.images.maxCount : 0;
    const partes=[], imagenes=[], omitidos=[];
    for(const d of est.docs){
      const { texto, imgs } = await textoYImagenesDe(d, Math.min(cupoImg,3));
      imgs.forEach(b=>{ if(cupoImg>0 && (!lim.images.maxInputBytes || b.size<=lim.images.maxInputBytes)){ imagenes.push(b); cupoImg--; } });
      if(texto.trim().length>150) partes.push(`### Documento: ${d.tipo} (${d.nombre})\n${texto}`);
      else if(imgs.length) partes.push(`### Documento: ${d.tipo} (${d.nombre}) — escaneado, va como imagen ${imagenes.length}`);
      else omitidos.push(d.nombre);
    }
    if(!partes.length){ S.iaBusy=null; S.iaMsg=["n-warn","No se pudo leer texto de los documentos. Si son escaneos, digita los datos a mano."]; pintar(); return; }
    const anio=new Date().getFullYear();
    const prompt = `Eres analista de crédito en Colombia. Lee los documentos de un cliente (RUT de la DIAN, certificado de Cámara de Comercio y estados financieros) y devuelve SOLO un objeto JSON con esta forma exacta:
{"rut":{"nit":"","razonSocial":"","ciiu":"código y descripción","responsabilidades":"","direccion":"","ciudad":"","fechaDocumento":"AAAA-MM-DD"},
 "camara":{"tipoSociedad":"","representanteLegal":"","fechaMatricula":"AAAA-MM-DD","fechaRenovacion":"AAAA-MM-DD","estadoMatricula":"","fechaExpedicion":"AAAA-MM-DD"},
 "eeff":{"act":{"anio":0,"activoCorriente":0,"inventarios":0,"activoTotal":0,"pasivoCorriente":0,"pasivoTotal":0,"patrimonio":0,"ingresos":0,"utilidadNeta":0},
         "ant":{"anio":0,"activoCorriente":0,"inventarios":0,"activoTotal":0,"pasivoCorriente":0,"pasivoTotal":0,"patrimonio":0,"ingresos":0,"utilidadNeta":0}},
 "notas":["observaciones breves sobre lo que no se pudo leer o inconsistencias"]}
Reglas: "act" es el año más reciente y "ant" el anterior. Las cifras van en pesos colombianos COMPLETOS: si el estado financiero dice "en miles de pesos" multiplica por 1000; si dice "en millones" multiplica por 1.000.000. Usa null para lo que no aparezca; no inventes datos. "ingresos" son los ingresos operacionales o ventas netas. Fechas en formato AAAA-MM-DD. Año actual: ${anio}.

${partes.join("\n\n")}`;
    const out = await S.sample.json(prompt, { modelTier:"default", ...(imagenes.length?{ images:imagenes }:{}) });
    let llenos=0;
    const fill=(dst,src)=>{ for(const [k,v] of Object.entries(src||{})){ if(v===null||v===""||v===undefined) continue; if(typeof v==="number"&&v===0&&k!=="anio") continue; dst[k]=v; llenos++; } };
    fill(est.rut, out?.rut); fill(est.camara, out?.camara); fill(est.eeff.act, out?.eeff?.act); fill(est.eeff.ant, out?.eeff?.ant);
    ["act","ant"].forEach(k=>{ CAMPOS_EEFF.forEach(([f])=>{ if(est.eeff[k][f]!=null) est.eeff[k][f]=Number(est.eeff[k][f])||0; }); });
    est.ia = { ...(est.ia||{}), fecha:hoy(), notas:Array.isArray(out?.notas)?out.notas.slice(0,8):[] };
    S.iaMsg = ["n-ok", `Claude completó ${llenos} dato(s). Revisa las cifras y presiona Guardar estudio.${omitidos.length?` No se pudo leer: ${omitidos.join(", ")}.`:""}${est.ia.notas.length?" Notas: "+est.ia.notas.join(" · "):""}`];
  }catch(e){
    S.iaMsg = ["n-warn", ({ not_granted:"No se dio permiso para usar Claude en esta página.", rate_limited:"Claude está ocupado. Intenta de nuevo en un momento.", invalid_json:"Claude no devolvió datos legibles. Intenta de nuevo.", prompt_too_large:"Los documentos son demasiado largos para leerlos juntos.", images_unavailable:"Esta vista no puede enviar imágenes a Claude." })[e?.code] || "No se pudieron leer los documentos. Digita los datos a mano." ];
    if(e?.code==="not_granted") S.sample=null;
  }
  S.iaBusy=null; pintar();
}

/* --------------------------------------------------------------- lectura de documentos con Claude */
async function contenidoDe(buf, mime, maxImgs){
  const imgs=[]; let texto="";
  if(mime==="application/pdf" && window.pdfjsLib){
    const pdf = await pdfjsLib.getDocument({ data:new Uint8Array(buf), isEvalSupported:false }).promise;
    const n = Math.min(pdf.numPages, 8);
    for(let p=1;p<=n;p++){ const pg=await pdf.getPage(p); const tc=await pg.getTextContent(); texto += `\n[página ${p}]\n` + tc.items.map(i=>i.str).join(" "); }
    if(texto.replace(/\[página \d+\]|\s/g,"").length < 150 && maxImgs>0){
      for(let p=1;p<=Math.min(pdf.numPages,maxImgs);p++){
        const pg=await pdf.getPage(p), vp=pg.getViewport({ scale:1.6 }), cv=document.createElement("canvas");
        cv.width=vp.width; cv.height=vp.height; await pg.render({ canvasContext:cv.getContext("2d"), viewport:vp }).promise;
        imgs.push(await new Promise(r=>cv.toBlob(r,"image/jpeg",0.85)));
      }
    }
  } else if(String(mime).startsWith("image/") && maxImgs>0){
    imgs.push(new Blob([buf], { type:mime }));
  }
  return { texto:texto.slice(0,14000), imgs };
}
/** fuentes: [{id?, buf?, mime, nombre}] → JSON de Claude */
async function leerArchivosClaude(fuentes, instruccion){
  if(!S.sample) throw { code:"not_granted" };
  const lim = await S.sample.limits().catch(()=>null);
  let cupo = lim?.images ? lim.images.maxCount : 0;
  const partes=[], imagenes=[];
  for(const f of fuentes){
    let buf=f.buf; if(!buf){ const r=await fetch("/_blob/"+f.id); if(!r.ok) throw { code:"fetch" }; buf=await r.arrayBuffer(); }
    const { texto, imgs } = await contenidoDe(buf, f.mime, Math.min(cupo,3));
    imgs.forEach(b=>{ if(cupo>0 && (!lim.images.maxInputBytes || b.size<=lim.images.maxInputBytes)){ imagenes.push(b); cupo--; } });
    if(texto.replace(/\[página \d+\]|\s/g,"").length>=150) partes.push(`### Archivo: ${f.nombre}\n${texto}`);
    else if(imgs.length) partes.push(`### Archivo: ${f.nombre} (escaneado, va como imagen)`);
  }
  if(!partes.length) throw { code:"sin_texto" };
  return await S.sample.json(`${instruccion}\n\n${partes.join("\n\n")}`, { modelTier:"default", ...(imagenes.length?{ images:imagenes }:{}) });
}

function aplicarLectura(tipo, d, L){
  if(!d.clienteId && L.nit && tipo!=="oc"){
    const k=String(L.nit).replace(/\D/g,"").slice(0,9);
    const c=S.clientes.find(x=>String(x.nit||"").replace(/\D/g,"").slice(0,9)===k && k);
    if(c){ Object.assign(d, snapCliente(c)); toast(`Cliente identificado: ${c.nombre}.`); }
    else if(!d.cliente?.nombre){ d.cliente.nombre=L.razonSocial||""; d.cliente.nit=L.nit||""; }
  }
  let sinMatch=0;
  L.items.forEach(li => {
    const id=String(li.productoId||"");
    if(id.startsWith("x:")){ const x=exclusivosDe(d.clienteId).find(e=>"x:"+e.id===id); if(x){ const it=itemExclusivo(x); it.cantidad=n0(li.cantidad); d.items.push(it); return; } }
    const p=S.productos.find(x=>x.id===id);
    if(p){ const it=itemDesde(p,tipo,d.clienteId); it.cantidad=n0(li.cantidad);
      if(tipo!=="rem" && n0(li.precioUnitario) && Math.round(n0(li.precioUnitario))!==Math.round(it.precio)) it.precioOC=Math.round(n0(li.precioUnitario));
      d.items.push(it); }
    else { sinMatch++; d.items.push({ productoId:"", descripcion:li.descripcion||"", presentacion:li.presentacion||"", cantidad:n0(li.cantidad), precio:tipo==="rem"?0:n0(li.precioUnitario), desc:0 }); }
  });
  if(tipo==="ven" && L.numero) d.ordenCliente=L.numero;
  if(tipo==="cot" && L.numero) d.observaciones=[d.observaciones, `Orden de compra del cliente: ${L.numero}`].filter(Boolean).join("\n");
  if(tipo==="rem" && L.direccionEntrega && !d.direccionEntrega) d.direccionEntrega=L.direccionEntrega;
  if(L.observaciones) d.observaciones=[d.observaciones, L.observaciones].filter(Boolean).join("\n");
  toast(`Se cargaron ${L.items.length} línea(s)${sinMatch?`; ${sinMatch} sin producto equivalente (revisa el precio)`:""}. Revisa y presiona Guardar.`);
}

function fechaHora(iso){ if(!iso) return "—"; const d=new Date(iso); return isNaN(d)?iso:d.toLocaleString("es-CO",{ dateStyle:"medium", timeStyle:"short" }); }
function prepararFirma(){
  const cv=$("#firma"); if(!cv) return;
  const box=cv.parentElement, dpr=window.devicePixelRatio||1, w=box.clientWidth, h=box.clientHeight;
  cv.width=w*dpr; cv.height=h*dpr; const ctx=cv.getContext("2d"); ctx.scale(dpr,dpr);
  const dibujar = () => { ctx.clearRect(0,0,w,h); ctx.lineCap="round"; ctx.lineJoin="round"; ctx.strokeStyle="#1d1d35"; ctx.lineWidth=2.2;
    [...FIRMA.trazos, FIRMA.actual].filter(Boolean).forEach(t=>{ ctx.beginPath(); t.forEach(([x,y],k)=> k?ctx.lineTo(x*w,y*h):ctx.moveTo(x*w,y*h)); if(t.length===1) ctx.lineTo(t[0][0]*w+0.1,t[0][1]*h); ctx.stroke(); }); };
  const pos = e => { const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)/r.width, (e.clientY-r.top)/r.height]; };
  cv.onpointerdown = e => { cv.setPointerCapture(e.pointerId); FIRMA.actual=[pos(e)]; box.querySelector(".firmahint")?.remove(); dibujar(); };
  cv.onpointermove = e => { if(!FIRMA.actual) return; FIRMA.actual.push(pos(e)); dibujar(); };
  cv.onpointerup = cv.onpointercancel = () => { if(FIRMA.actual){ FIRMA.trazos.push(FIRMA.actual); FIRMA.actual=null; } };
  if(FIRMA.trazos.length) box.querySelector(".firmahint")?.remove();
  dibujar();
}
function firmaPNG(){
  const W=600, H=200, cv=document.createElement("canvas"); cv.width=W; cv.height=H; const ctx=cv.getContext("2d");
  ctx.fillStyle="#fff"; ctx.fillRect(0,0,W,H); ctx.lineCap="round"; ctx.lineJoin="round"; ctx.strokeStyle="#1d1d35"; ctx.lineWidth=3;
  FIRMA.trazos.forEach(t=>{ ctx.beginPath(); t.forEach(([x,y],k)=> k?ctx.lineTo(x*W,y*H):ctx.moveTo(x*W,y*H)); if(t.length===1) ctx.lineTo(t[0][0]*W+0.5,t[0][1]*H); ctx.stroke(); });
  return cv.toDataURL("image/png");
}
async function sha256(txt){
  try{ const b=await crypto.subtle.digest("SHA-256", new TextEncoder().encode(txt)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }
  catch(_){ let h=0; for(const ch of txt) h=(h*31+ch.charCodeAt(0))|0; return (h>>>0).toString(16).padStart(16,"0"); }
}

    try{ const actual=S[TIPOS[tipo].col].find(x=>x.id===d.id);
      // La copia de la base puede no traer aún la firma recién guardada: se usa la más reciente.
      const base = actual && (actual.recepcion?.hash||"")===(d.recepcion?.hash||"") ? actual : d;
      await guardar(TIPOS[tipo].col, d.id, limpiar({ ...base, envios })); }catch(_){}
    toast(`Correo enviado a ${para.join(", ")}.`); S.enviando=false; pintar(); return true;
  }catch(e){
    S.enviando=false; pintar();
    toast(({ server_not_connected:"Gmail no está conectado. Agrégalo en claude.ai → Configuración → Conectores.", needs_reauth:"Reconecta Gmail en claude.ai → Configuración → Conectores.",
      not_in_manifest:"No se dio permiso para usar Gmail en esta página.", approval_required:"Enviar correo necesita tu aprobación; ábrelo en claude.ai y permite Gmail.",
      blocked_by_policy:"Tu organización no permite enviar correo desde aquí.", selection_required:"Elige cuál cuenta de Gmail usar en el aviso de claude.ai.",
      tool_error:"Gmail rechazó el envío: "+(e?.message||"").slice(0,120), server_unavailable:"No hubo respuesta de Gmail. Revisa tu carpeta Enviados antes de reintentar.",
      upstream_error:"No se confirmó el envío. Revisa tu carpeta Enviados antes de reintentar." })[e?.code] || "No se pudo enviar el correo. Revisa tu carpeta Enviados antes de reintentar.");
    return false;
  }
}

boot();
</script>
